name: Fix ASCII visibility

on:
  push:
    branches:
      - portfolio-copy-cursor-background
    paths:
      - .github/workflows/fix-ascii-visibility.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-copy-cursor-background

      - name: Correct canvas stacking and visibility
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")

          replacements = [
              ("""body::before {
      position: fixed;
      inset: 0;
      z-index: -2;""", """body::before {
      position: fixed;
      inset: 0;
      z-index: 0;"""),
              ("""#ascii-field {
      position: fixed;
      inset: 0;
      z-index: -1;""", """#ascii-field {
      position: fixed;
      inset: 0;
      z-index: 0;"""),
              ("""const count = Math.min(5, Math.max(0, Math.floor(pointer.speed / 4.2)));""", """const count = Math.min(6, Math.max(0, Math.floor(pointer.speed / 3.4)));"""),
              ("""const alpha = Math.sin(progress * Math.PI) * 0.2;""", """const alpha = Math.sin(progress * Math.PI) * 0.28;"""),
          ]

          for old, new in replacements:
              if old not in content:
                  raise SystemExit(f"Expected snippet not found: {old!r}")
              content = content.replace(old, new, 1)

          path.write_text(content, encoding="utf-8")

      - name: Commit fix to pull request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix ASCII canvas visibility"
          git push origin HEAD:portfolio-copy-cursor-background
