<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 660" role="img" aria-labelledby="title"><title id="title">Historian-based simulation and OpenPLC validation workflow</title><rect width="360" height="660" rx="16" fill="#111720"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#ff914d" stroke-width="1.5"/></marker></defs><rect x="18" y="20" width="324" height="100" rx="9" fill="#18222e" stroke="#526176"/><text x="180" y="49" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#ffad78">Historical process data</text><text x="180" y="77" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#f3f4f7">AVEVA PI Web API / AF SDK</text><text x="180" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#c5cedb">Measurements and timestamps</text><path d="M180,122 V143" stroke="#ff914d" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="148" width="324" height="100" rx="9" fill="#18222e" stroke="#526176"/><text x="180" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#ffad78">Prepare &amp; model</text><text x="180" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#f3f4f7">Clean and align observations</text><text x="180" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#c5cedb">Python / scikit-learn</text><path d="M180,250 V271" stroke="#ff914d" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="276" width="324" height="100" rx="9" fill="#18222e" stroke="#526176"/><text x="180" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#ffad78">Simulate a scenario</text><text x="180" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#f3f4f7">Python owns simulation state</text><text x="180" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#c5cedb">Calculate model outputs</text><path d="M180,378 V399" stroke="#ff914d" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="404" width="324" height="100" rx="9" fill="#18222e" stroke="#526176"/><text x="180" y="433" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#ffad78">OpenPLC via Modbus</text><text x="180" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#f3f4f7">Map and transfer outputs</text><text x="180" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#c5cedb">Inspect the software response</text><path d="M180,506 V527" stroke="#ff914d" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="532" width="324" height="100" rx="9" fill="#18222e" stroke="#526176"/><text x="180" y="561" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#ffad78">Read-back checks</text><text x="180" y="589" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#f3f4f7">Compare expected and read values</text><text x="180" y="613" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#c5cedb">Validate the integration</text></svg>